apiVersion: v1
kind: ServiceAccount
metadata:
  name: bruno-reader
  namespace: kube-system
  labels:
    app.kubernetes.io/name: bruno-reader
    app.kubernetes.io/part-of: k8s-gitops-bruno
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bruno-gitops-reader
  labels:
    app.kubernetes.io/part-of: k8s-gitops-bruno
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - pods/log
      - services
      - serviceaccounts
      - persistentvolumeclaims
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list"]
  - apiGroups: ["authorization.k8s.io"]
    resources:
      - selfsubjectaccessreviews
      - selfsubjectrulesreviews
    verbs: ["create"]
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
      - applicationsets
      - appprojects
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io", "kustomize.toolkit.fluxcd.io", "helm.toolkit.fluxcd.io"]
    resources:
      - gitrepositories
      - ocirepositories
      - kustomizations
      - helmreleases
    verbs: ["get", "list"]
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
      - certificaterequests
    verbs: ["get", "list"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources:
      - policyreports
      - clusterpolicyreports
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bruno-gitops-reader
  labels:
    app.kubernetes.io/part-of: k8s-gitops-bruno
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bruno-gitops-reader
subjects:
  - kind: ServiceAccount
    name: bruno-reader
    namespace: kube-system
